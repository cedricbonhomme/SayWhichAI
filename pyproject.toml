[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-disclosure"
version = "0.1.0"
description = "Charts of the AI use a project declares in its commits and pull requests"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-disclosure = "ai_disclosure.cli:main"

[tool.setuptools]
packages = ["ai_disclosure"]

[tool.setuptools.package-data]
ai_disclosure = ["site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
