name: Publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # every day, to follow the projects
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Keep the clones of the projects between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: clones-${{ github.run_id }}
          restore-keys: clones-
      - run: pip install . pytest
      - run: pytest -q
      - name: Render the videos that are more than a week old
        # Kept in .cache with the clones. The site is published without a video
        # when this step fails or takes too long.
        continue-on-error: true
        timeout-minutes: 40
        run: |
          # Installing the packages can take longer than rendering: only when needed.
          if [ -z "$(ai-disclosure video --projects projects --max-age 7 --due)" ]; then
            echo "Every video is recent enough."
            exit 0
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gource ffmpeg xvfb
          xvfb-run -a -s "-screen 0 1280x720x24" ai-disclosure video --projects projects --max-age 7
      - name: Build the site
        run: ai-disclosure build --projects projects --output _site
        env:
          # Reads public repositories only: GitHub accounts and pull requests.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
