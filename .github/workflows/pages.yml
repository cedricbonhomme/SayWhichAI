name: Publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # every day, to follow the projects
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Keep the clones of the projects between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: clones-${{ github.run_id }}
          restore-keys: clones-
      - run: pip install . pytest
      - run: pytest -q
      - name: Build the site
        run: ai-disclosure build --projects projects --output _site
        env:
          # Reads public repositories only: GitHub accounts and pull requests.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
