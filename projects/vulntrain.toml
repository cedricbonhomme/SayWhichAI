[project]
name = "VulnTrain"
repository = "vulnerability-lookup/VulnTrain"
logo = "docs/static/img/VulnTrain-logo.png"

[policy]
url = "https://github.com/vulnerability-lookup/VulnTrain/blob/main/CONTRIBUTING.md#use-of-ai-and-llm-tools"
trailer_since = "2026-11-18"

[[policy.checkbox]]
id = "ai"
label = "AI-generated"
match = ["generated with an AI tool"]
since = "2026-11-18"

[[policy.checkbox]]
id = "human"
label = "Read and tested"
match = ["read, understood and tested"]
since = "2026-11-18"

[identities]
bots = []
