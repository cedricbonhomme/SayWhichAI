# The projects this site publishes, in the order of the project menu. The overview
# page sorts them by the share of commits declaring a model.
#
# Each name is a file of projects/, without ".toml". A project file that is not
# listed here is kept for another site and is neither read nor published.
#
# Another site (another server, another selection) has its own file:
#     saywhichai build --site /path/to/other-site.toml
# Without any site file, every project of projects/ is published.
#
# url: where the site is published. It gives the pages their canonical address and
# their link previews, and writes sitemap.xml. Leave it out for a site built elsewhere.
# [site.security]: the fields of .well-known/security.txt (RFC 9116), Contact first.
# The build adds Expires and, with url, Canonical.

[site]
url = "https://www.saywhichai.org"
projects = [
    "vulnerability-lookup",
    "vulntrain",
    "fedivuln",
    "ml-gateway",
    "vulniverse",
    "gcve",
    "gcve-eu-kev",
    "misp",
    "misp-workbench",
    "mispql",
    "pivotick",
    "bsimvis",
    "ail-framework",
    "flowintel",
    "rulezet-core",
    "sysdiagnose",
    "opencti",
    "tenzir",
    "newspipe",
    "stegano",
    "pyenigma",
    "iterated-function-systems",
    "saywhichai",
]

[site.security]
Contact = "mailto:cedric@cedricbonhomme.org"
Encryption = "https://pgp.circl.lu/pks/lookup?op=get&search=0x55f5d60eefca3591008918e7a1cb94de57b7a70d"
Acknowledgments = "https://www.cedricbonhomme.org/software/"
Preferred-Languages = "en, fr"
